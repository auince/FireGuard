<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>智慧消防 · 场景专业复核</title>
<style>
:root{font:15px/1.65 system-ui,sans-serif;color:#173047;background:#f1f4f7}*{box-sizing:border-box}body{margin:0}header{background:#173047;color:#fff;padding:24px 5vw}h1{margin:0;font-size:24px}header p{margin:6px 0 0;color:#cdd9e3}main{max-width:1360px;margin:auto;padding:24px}.toolbar,.card{background:white;border:1px solid #d7e0e9;border-radius:12px;padding:20px;margin-bottom:18px}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{display:block;color:#506577;font-size:14px}button,select,input,textarea{font:inherit;border:1px solid #cbd6e1;border-radius:6px;padding:8px;background:white;color:#173047}button{cursor:pointer}.primary{background:#a92d39;color:white;border:0}button:disabled{opacity:.4}textarea{width:100%;min-height:85px}.layout{display:grid;grid-template-columns:290px 1fr;gap:20px}.cases{max-height:75vh;overflow:auto}.cases button{display:block;text-align:left;width:100%;margin:7px 0}.cases button.selected{border-color:#a92d39;background:#fff2f3}.tag{display:inline-block;border-radius:9px;background:#edf2f6;padding:1px 8px;font-size:12px;margin-right:4px}.warn{background:#fff3d8;padding:12px;border-radius:8px;color:#7c5610}.muted{color:#60788c;font-size:13px}.photo{max-width:100%;max-height:420px;object-fit:contain}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px}details{border-top:1px solid #e2e9ef;padding:10px 0}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f4f7f9;padding:12px}.claim{border-left:3px solid #b3c4d2;padding-left:12px;margin:16px 0}.ratings{display:grid;grid-template-columns:1fr 1fr;gap:14px}a{color:#1e6587}#count{font-weight:650}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}@media(max-width:800px){.layout{grid-template-columns:1fr}.cases{max-height:240px}.ratings{grid-template-columns:1fr}main{padding:12px}}
</style>
<header><h1>智慧消防 · 场景专业复核</h1><p>原始现场资料、执行结果与法规证据逐例核对</p></header>
<main><div class="toolbar"><label>设施<select id="facility"><option value="">全部设施</option value="indoor_hydrant">室内消火栓</option><option value="outdoor_hydrant">室外消火栓</option><option value="fire_extinguisher">灭火器</option></select></label><label>数据划分<select id="split"><option value="">全部划分</option><option value="dev">开发集</option><option value="validation">验证集</option><option value="holdout">最终验收集</option></select></label><label>资料<select id="image"><option value="">全部场景</option><option value="yes">含原始图像</option><option value="no">纯文字场景</option></select></label><label>复核状态<select id="status"><option value="">全部状态</option><option value="pending">待审</option><option value="reviewed">已填写复核</option></select></label><span id="count"></span><button class="primary" id="export">导出复核结果</button></div>
<p class="warn">工程检查与模型辅助核验不等于专业准确率。所有专业判断初始为空；请核对原图、法规原文和适用条件后填写。最终验收集不得用于策略调参。</p>
<div class="layout"><aside class="card"><h2>场景列表</h2><div id="list" class="cases"></div></aside><section id="detail" class="card"></section></div></main>
<script id="data" type="application/json">__REVIEW_DATA__</script>
<script>
const rows=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={indoor_hydrant:'室内消火栓',outdoor_hydrant:'室外消火栓',fire_extinguisher:'灭火器',dev:'开发集',validation:'验证集',holdout:'最终验收集',pending:'待审',reviewed:'已填写复核',visible_anomaly:'可见异常',no_visible_anomaly:'未见明显异常',uncertain:'无法判断',observation:'现场观察',information_request:'待核查事项',legal_assessment:'法规判断',unknown:'待确认',supported:'适用条件已确认',not_applicable:'不适用',sufficient:'证据充分',insufficient:'仍需补充'};
const labels={citation_support_correct:'结论是否得到引用支持',applicability_correct:'法规适用性是否正确',human_referral_correct:'补充信息与转人工处理是否正确',critical_points_complete:'关键点是否完整'};
let selected=null;
function filtered(){return rows.filter(r=>(!$('facility').value||r.facility===$('facility').value)&&(!$('split').value||r.split===$('split').value)&&(!$('status').value||r.review_status===$('status').value)&&(!$('image').value||Boolean(r.review_image)===($('image').value==='yes')))}
function renderList(){let visible=filtered();$('count').textContent=visible.length+' / '+rows.length+'例';$('list').innerHTML=visible.map(r=>`<button data-case="${esc(r.case_id)}" class="${selected===r.case_id?'selected':''}"><strong>${esc(r.case_id)}</strong><br><span class="tag">${names[r.split]}</span><span class="tag">${r.review_image?'图像场景':'文字场景'}</span><small>${names[r.review_status]||esc(r.review_status)}</small></button>`).join('');$('list').querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>show(b.dataset.case));if(!visible.some(r=>r.case_id===selected)){selected=null;if(visible.length)show(visible[0].case_id);else $('detail').innerHTML='<p>当前筛选没有场景。</p>'}}
function show(id){selected=id;const r=rows.find(x=>x.case_id===id),req=r.executed_input||r.original_input;
$('detail').innerHTML=`<div class="row"><h2>${names[r.facility]} · ${esc(r.case_id)}</h2><span class="tag">${names[r.split]}</span></div><p>${esc(req.query)}</p><p class="muted">核查日期：${esc(req.as_of)} · 地区：${esc(req.jurisdiction)} · ${names[r.review_status]||esc(r.review_status)}</p>${r.review_image?`<a href="${esc(r.review_image)}" target="_blank" rel="noopener"><img class="photo" src="${esc(r.review_image)}" alt="${esc(r.case_id)}原始现场图像"></a><p class="muted">点击查看原图。模型训练重合标记：${esc(r.training_overlap_status)}</p>`:''}<details><summary>原始场景、已确认条件与执行上下文</summary><pre>${esc(JSON.stringify({original_input:r.original_input,executed_input:r.executed_input,frozen_memory:r.frozen_memory,fault_injection:r.fault_injection},null,2))}</pre></details><h3>模型观察</h3>${r.model_observations.map(o=>`<p><span class="tag">${esc(names[o.status]||o.status)}</span>${esc(o.description)}</p>`).join('')||'<p class="muted">未产生图像观察。</p>'}<h3>待核查结论</h3>${r.model_conclusions.map(c=>`<div class="claim"><p>${esc(c.text)}</p><small class="muted">类型：${esc(names[c.kind]||c.kind)} · 适用性：${esc(names[c.applicability]||c.applicability)} · 证据充分性：${esc(names[c.sufficiency]||c.sufficiency)}<br>待补充：${esc(c.missing_fields.join('、')||'未列出')}<br>引用：${c.evidence_ids.map(e=>{let i=r.retrieved_evidence.findIndex(x=>x.evidence_id===e);return i<0?'未知引用':`<a href="#evidence-${i}">[${i+1}]</a>`}).join(' ')||'无'}</small></div>`).join('')||'<p>没有可用结论，请查看执行记录。</p>'}<h3>返回的法规原文</h3>${r.retrieved_evidence.map((e,i)=>`<details id="evidence-${i}"><summary>[${i+1}] ${esc(e.document_title)} · ${esc(e.location?.article||'原文片段')}</summary><p>${esc(e.text)}</p><p class="muted">生效：${esc(e.effective_from)} · 终止：${esc(e.effective_until||'未指定')} · ${esc(e.jurisdiction)}</p>${/^https?:\/\//.test(e.source_url||'')?`<a href="${esc(e.source_url)}" target="_blank" rel="noopener">官方来源</a>`:''}<pre>${esc(JSON.stringify({evidence_id:e.evidence_id,version_id:e.version_id,location:e.location},null,2))}</pre></details>`).join('')}<details><summary>工程检查与模型辅助核验</summary><pre>${esc(JSON.stringify({program_checks:r.program_checks,verification:r.hard_verification},null,2))}</pre></details><h3>专业复核记录</h3><p class="muted">不能确认的项目保留“未评估”。填写后导出保存，刷新页面会丢失未导出的修改。</p><div class="ratings">${Object.entries(labels).map(([k,v])=>`<label>${v}<select data-rating="${k}"><option value="" ${r[k]==null?'selected':''}>未评估</option><option value="yes" ${r[k]===true?'selected':''}>正确／完整</option><option value="no" ${r[k]===false?'selected':''}>存在错误／缺失</option></select></label>`).join('')}</div><label>审核者<input id="reviewer" value="${esc(r.reviewer||'')}"></label><label>纠错、专业金标与说明<textarea id="notes">${esc(r.notes||'')}</textarea></label><p class="row"><button id="save" class="primary">保存本例复核</button><span id="saved" class="muted"></span></p>`;
$('save').onclick=()=>{if(!$('reviewer').value.trim()){$('saved').textContent='请填写审核者。';return}if(!Array.from($('detail').querySelectorAll('[data-rating]')).some(el=>el.value)&&!$('notes').value.trim()){$('saved').textContent='请填写至少一项判断或无法评估的原因。';return}r.reviewer=$('reviewer').value.trim();r.notes=$('notes').value;r.reviewed_at=new Date().toISOString();r.review_status='reviewed';$('detail').querySelectorAll('[data-rating]').forEach(el=>r[el.dataset.rating]=el.value===''?null:el.value==='yes');$('saved').textContent='已保留在本页，请导出文件保存。';renderList()};
$('list').querySelectorAll('[data-case]').forEach(b=>b.classList.toggle('selected',b.dataset.case===id));}
for(let id of ['facility','split','image','status'])$(id).onchange=renderList;
$('export').onclick=()=>{const blob=new Blob([rows.map(r=>JSON.stringify(r)).join('\n')+'\n'],{type:'application/x-ndjson;charset=utf-8'}),link=document.createElement('a'),url=URL.createObjectURL(blob);link.href=url;link.download='fire-inspection-expert-review.jsonl';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
renderList();
</script></html>
