<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>消防巡检 · Astra 已复核标签</title>
<style>body{margin:0;background:#f4f6f8;color:#203240;font:15px/1.7 system-ui,-apple-system,sans-serif}header{padding:28px 5vw;background:#173946;color:white}h1{font-size:26px;margin:0}header p{opacity:.85}main{margin:24px 5vw}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{padding:10px 18px;background:#ffffff12;border:1px solid #ffffff30;border-radius:8px}.stat b{font-size:24px;display:block}nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}select,input,button{font:inherit;padding:8px 10px;border:1px solid #bdcbd1;border-radius:6px;background:white;color:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:255px minmax(0,1fr);gap:20px}aside{max-height:75vh;overflow:auto}aside button{display:block;text-align:left;width:100%;margin-bottom:5px;font-size:13px}.selected{border-color:#1d837f;background:#def1ed}article{background:white;border:1px solid #dce4e7;border-radius:12px;padding:24px;min-width:0}h2{font-size:19px}h3{font-size:16px;border-bottom:1px solid #e6ebee;padding-bottom:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}img{display:block;margin:auto;max-width:100%;max-height:550px}.tag{display:inline-block;font-size:12px;padding:3px 9px;background:#e6f3ef;border-radius:5px;margin:0 6px 5px 0}.note{padding:12px;background:#f2f7fa;border-left:3px solid #357385}.uncertain{background:#fff7e7;border-color:#c79239}.small{font-size:13px;color:#657984}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.65 system-ui}summary{cursor:pointer;color:#246b78;padding:8px 0}.obs{border-left:3px solid #66a69e;padding:8px 12px;margin:8px 0;background:#f7f9fa}a{color:#166b7a}li{margin:3px 0}@media(max-width:850px){.layout,.grid{grid-template-columns:1fr}aside{max-height:200px}article{padding:16px}h1{font-size:22px}}</style>
<header><h1>消防巡检 · Astra 已复核标签</h1><p>补充场景上下文、原图和法规后，逐项复核并修正 · 标注复核已完成</p><div id="stats" class="stats"></div></header>
<main><nav><select id="facility" aria-label="设施类型"><option value="">全部设施</option><option value="indoor_hydrant">室内消火栓</option><option value="outdoor_hydrant">室外消火栓</option><option value="fire_extinguisher">灭火器</option></select><select id="split" aria-label="数据划分"><option value="">全部划分</option><option>dev</option><option>validation</option><option>holdout</option></select><select id="decision" aria-label="复核结果"><option value="">全部复核结果</option><option value="correct">已修正</option><option value="accept">原标签保留</option><option value="uncertain">保留不确定事实</option><option value="images">含原图</option><option value="context">已补多轮上下文</option></select><input id="search" aria-label="搜索场景" placeholder="搜索场景或答案"><button id="export">导出当前筛选标签</button><span id="count" class="small"></span></nav><div class="layout"><aside id="list"></aside><article id="detail"></article></div></main>
<script>
const data=__ASTRA_DATA__;let current=null,filtered=data;
const names={indoor_hydrant:'室内消火栓',outdoor_hydrant:'室外消火栓',fire_extinguisher:'灭火器',abnormal:'可见异常',normal:'已观察范围未见异常',uncertain:'无法判断',not_applicable:'不适用',visible_anomaly:'可见异常',no_visible_anomaly:'未见异常',accept:'原标签保留',correct:'已修正',usable:'可评估',partially_evaluable:'部分维度可评估',not_evaluable:'排除评估',resolved_by_context:'已由上下文解决',corrected_label:'已纠正标签',valid_uncertainty:'裁定为不确定',test_stimulus:'有效测试情境',out_of_scope:'不属于本题判定范围'};
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),list=xs=>xs.length?'<ul>'+xs.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="small">无</p>';
$('stats').innerHTML=[[data.length+' / 300','场景已复核'],[data.filter(r=>r.review_decision==='correct').length,'场景已修正'],[data.filter(r=>r.image_sha256).length,'原图已检查'],[0,'人工标注待办']].map(([n,s])=>'<div class="stat"><b>'+n+'</b>'+s+'</div>').join('');
if(data.length<300)document.querySelector('header p').textContent='批量复核进行中；本页仅展示已完成的场景。';
function render(r){current=r;document.querySelectorAll('aside button').forEach(b=>b.classList.toggle('selected',b.dataset.id===r.case_id));let rev=r.review,ev=rev.evaluation;
$('detail').innerHTML=`<span class="tag">${esc(names[r.facility])}</span><span class="tag">${esc(r.split)}</span><span class="tag">${esc(names[r.review_decision])}</span><span class="tag">${esc(names[ev.status])}</span><h2>${esc(r.case_id)}</h2><p>${esc(r.original_input.query)}</p><p class="small">法规核查日期 ${esc(r.original_input.as_of)} · ${esc(r.original_input.jurisdiction)} · ${esc(r.snapshot_id)}</p><div class="note"><b>Astra 复核意见</b>${list(rev.review_notes)}</div><div class="grid"><section><h3>原始现场图像</h3>${r.review_image?'<a target="_blank" rel="noopener" href="'+esc(r.review_image)+'"><img src="'+esc(r.review_image)+'" alt="本例原始现场图像"></a>':'<p class="small">本例无图像，按文字场景和对话上下文评估。</p>'}<h3>已确认事实</h3>${list(r.scene_facts)}<details><summary>实际执行输入与多轮背景</summary><pre>${esc(JSON.stringify(r.execution_context,null,2))}</pre></details></section><section><h3>最终视觉标签：${esc(names[r.visual_decision])}</h3>${r.gold_observations.map(o=>'<div class="obs"><b>'+esc(o.object)+' · '+esc(names[o.status])+'</b><p>'+esc(o.description)+'</p><span class="small">'+esc(o.hazard_labels.join('、'))+'</span></div>').join('')||'<p>无视觉标签</p>'}<h3>最终参考答案</h3><p>${esc(r.reference_answer)}</p></section></div><h3>首轮问题逐项裁决</h3>${rev.issue_resolutions.map(x=>'<div class="obs"><b>'+esc(names[x.disposition])+'</b><p>'+esc(r.first_pass_scenario_issues[x.issue_index])+'</p><p>'+esc(x.reason)+'</p></div>').join('')||'<p class="small">首轮未报告问题，已完成原图、上下文和法规核查。</p>'}<details><summary>查看首轮与复核差异（${r.changed_fields.length} 个字段）</summary>${r.changed_fields.map(k=>'<h4>'+esc(k)+'</h4><p class="small">首轮</p><pre>'+esc(JSON.stringify(r.first_pass_annotation[k],null,2))+'</pre><p class="small">复核后</p><pre>'+esc(JSON.stringify(rev.patch[k],null,2))+'</pre>').join('')||'<p>保留原标签。</p>'}</details><h3>评估口径</h3><p>${esc(ev.reason)}</p>${ev.uncertainties.length?'<div class="note uncertain"><b>最终保留的不确定事实（已完成裁决）</b>'+list(ev.uncertainties)+'</div>':''}<h4>排除的判断维度</h4>${list(ev.excluded_dimensions)}<p class="small">不确定不计为正常。二分类仅统计具有明确视觉真值的样本；补充法规不在冻结索引内时，不计入该快照检索指标。</p><h3>关键判定点</h3>${list(r.critical_points)}<h3>不得作出的结论</h3>${list(r.forbidden_claims)}<h3>现场尚缺信息</h3>${list(r.missing_information)}<h3>法规证据</h3>${Object.entries(r.reference_aliases).map(([k,e])=>'<details><summary>'+esc(k+' · '+e.title+' · '+e.article)+(e.indexed_in_snapshot===false?' · 复核补充正文':'')+'</summary><pre>'+esc(e.text)+'</pre><p class="small">生效 '+esc(e.effective_from)+' · 失效（不含）'+esc(e.effective_until||'未指定')+' · 位置 '+esc(JSON.stringify(e.location))+'</p><a href="'+esc(e.source_url)+'" target="_blank" rel="noopener">查看官方来源</a></details>').join('')}<details><summary>标签来源与评估掩码</summary><p>来源：GPT-6 Astra 首轮标注及第二轮复核。标签流程已完成，无人工标注等待。模型复核不等同于人类专家审定，修正比例不代表准确率。</p><pre>${esc(JSON.stringify({model:r.returned_model,protocol:r.protocol,packet_hash:r.packet_hash,reviewed_at:r.reviewed_at,evaluation_mask:r.evaluation_mask},null,2))}</pre></details>`;}
function filter(){const f=$('facility').value,s=$('split').value,d=$('decision').value,q=$('search').value.trim();filtered=data.filter(r=>(!f||r.facility===f)&&(!s||r.split===s)&&(!d||(d==='images'?r.image_sha256:d==='uncertain'?r.review.evaluation.uncertainties.length:d==='context'?Object.keys(r.execution_context.frozen_memory.working||{}).length:r.review_decision===d))&&(!q||(r.case_id+r.original_input.query+r.reference_answer).includes(q)));$('count').textContent=`显示 ${filtered.length} / ${data.length}`;$('list').innerHTML=filtered.map(r=>'<button data-id="'+esc(r.case_id)+'">'+esc(r.case_id)+'<br><span class="small">'+esc(names[r.review_decision])+' · '+esc(names[r.visual_decision])+'</span></button>').join('');$('list').querySelectorAll('button').forEach(b=>b.onclick=()=>render(filtered.find(r=>r.case_id===b.dataset.id)));if(filtered.length)render(filtered.find(r=>current&&current.case_id===r.case_id)||filtered[0]);else $('detail').innerHTML='<p>没有匹配场景。</p>';}
['facility','split','decision','search'].forEach(x=>$(x).addEventListener('input',filter));$('export').onclick=()=>{let blob=new Blob([filtered.map(r=>JSON.stringify(r)).join('\n')+'\n'],{type:'application/x-ndjson'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Astra已复核标签.jsonl';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};filter();
</script></html>
