<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智慧消防 · 巡检核查工作台</title>
<style>
:root{--bg:#f2f5f8;--ink:#172636;--muted:#607285;--brand:#b02d35;--line:#dbe3eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 system-ui,sans-serif}header{background:#132a40;color:white;padding:22px 5vw;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}header small{color:#bfcedb}nav{padding:12px 5vw;background:white;display:flex;gap:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}button{border:1px solid var(--line);background:white;border-radius:7px;padding:9px 15px;cursor:pointer;color:var(--ink)}button.primary{background:var(--brand);color:white;border-color:var(--brand)}button:hover{filter:brightness(.96)}button:disabled{opacity:.5;cursor:not-allowed}main{max-width:1320px;padding:24px;margin:auto}.grid{display:grid;grid-template-columns:360px 1fr;gap:22px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:18px}.card h2{margin:0 0 14px;font-size:18px}label{display:block;margin:12px 0 5px;color:var(--muted)}input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:6px;width:100%;padding:9px;background:#fff}textarea{min-height:90px}small,.muted{color:var(--muted)}.tag{display:inline-block;background:#edf2f6;padding:2px 9px;border-radius:10px;font-size:12px;margin-right:5px}.warn{background:#fff4dc;color:#875500;padding:12px;border-radius:8px}.ok{color:#177356}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.list{max-height:460px;overflow-y:auto}.list button{display:block;width:100%;text-align:left;margin:7px 0}.hidden{display:none!important}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fa;padding:15px;border-radius:8px;font-size:13px}a{color:#256080}details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer}#notice{position:sticky;top:0;z-index:5;background:#fff1df;padding:12px 24px;display:none}#login{max-width:420px;margin:70px auto}section{min-width:0}.claim{border-left:3px solid #829bb0;padding-left:14px;margin:18px 0}.claim select{max-width:220px}.preview{max-width:100%;max-height:260px;object-fit:contain}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:9px;text-align:left;border-bottom:1px solid var(--line)}@media(max-width:800px){.grid{grid-template-columns:1fr}main{padding:14px}header{padding:18px}nav{padding:10px}}
</style><header><div><h1>智慧消防 · 巡检核查工作台</h1><small>现场证据 · 适用条款 · 人工复核</small></div><button id="logout">退出</button></header><div id="notice"></div>
<div id="login" class="card"><h2>登录工作台</h2><label for="username">账号</label><input id="username" autocomplete="username"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password"><p><button class="primary" id="signin">登录</button></p><small>支持巡检员、复核员和管理员。账号由项目管理员分配。</small></div>
<div id="work" class="hidden"><nav><button data-tab="inspection">巡检与核查</button><button data-tab="legal">法规版本</button><button data-tab="memory">记忆与经验</button><button data-tab="feedback">反馈归因</button><button data-tab="policies">策略与评测</button><button data-tab="observability">运行统计</button></nav>
<main><section id="inspection" class="grid"><aside><div class="card"><h2>新建核查</h2><div class="row"><button id="new-session">开启新巡检</button><button id="continue-session">承接所选核查</button></div><small id="session-label">当前为新会话，可连续提交追问。</small><label>任务类型</label><select id="mode"><option value="inspection">图像巡检</option><option value="retrieval">法规辅助核查</option><option value="annotation">图像预标注</option></select><label>设施</label><select id="facility"><option value="auto">自动识别</option><option value="indoor_hydrant">室内消火栓</option><option value="outdoor_hydrant">室外消火栓</option><option value="fire_extinguisher">灭火器</option></select><label>现场照片</label><input type="file" id="photo" accept="image/*"><label>问题与现场说明</label><textarea id="query" placeholder="例如：消防箱被物品遮挡，应补充哪些现场信息、依据哪些条款核查？"></textarea><label>核查日期</label><input id="asof" type="date"><label>建筑是否为高层</label><select id="highrise"><option value="unknown">尚未确认</option><option value="yes">已确认是高层</option><option value="no">已确认不是高层</option></select><label>地区</label><select id="region"><option>四川</option><option>全国</option></select><p><button class="primary" id="submit">提交核查</button></p><small>照片无法确定的尺寸、压力和配置数量，将保留为待核查项。</small></div><div class="card list"><h2>最近任务</h2><button id="refresh">刷新</button><div id="jobs"></div></div></aside><div id="report"><div class="card"><h2>核查报告</h2><p class="muted">提交任务或选择已有记录。报告先形成草稿，由复核员逐条核实后定稿。</p></div></div></section>
<section id="legal" class="hidden"></section><section id="memory" class="hidden"></section><section id="feedback" class="hidden"></section><section id="policies" class="hidden"></section><section id="observability" class="hidden"></section></main></div>
<script>
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=sessionStorage.getItem('xf-token')||'',selected=null,current=null,tab='inspection',previewURL=null;
let conversation=crypto.randomUUID();
const names={queued:'等待执行',running:'正在核查',awaiting_review:'待人工复核',awaiting_information:'待补充信息',complete:'已完成',failed:'执行失败',draft:'候选草稿',canary:'灰度验证',active:'已发布',rolled_back:'已回滚'};
function notify(s){$('notice').textContent=s;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',9000)}
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(method==='POST'?{'Idempotency-Key':crypto.randomUUID()}: {})},body:body===undefined?undefined:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(typeof(d.error||d.detail)==='string'?(d.error||d.detail):JSON.stringify(d.detail));return d}
function show(){ $('login').classList.toggle('hidden',!!token);$('work').classList.toggle('hidden',!token);if(token)loadJobs()}
$('signin').onclick=async()=>{try{let d=await api('/api/auth/login','POST',{username:$('username').value,password:$('password').value});token=d.access_token;sessionStorage.setItem('xf-token',token);$('password').value='';show()}catch(e){notify(e.message)}};
$('logout').onclick=()=>{sessionStorage.removeItem('xf-token');token='';show()};
$('asof').value=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function fileData(file){return new Promise((resolve,reject)=>{if(!file)return resolve(null);let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
$('new-session').onclick=()=>{conversation=crypto.randomUUID();$('query').value='';$('photo').value='';$('session-label').textContent='已开启新会话。';};
$('continue-session').onclick=()=>{if(!current?.input?.session_id){notify('请先选择一条核查记录');return}conversation=current.input.session_id;$('facility').value=current.input.facility||'auto';$('query').value='';$('photo').value='';$('session-label').textContent='已承接所选核查，可以继续追问。';};
$('submit').onclick=async()=>{try{let scene={};if($('highrise').value!=='unknown')scene.highrise=$('highrise').value==='yes';let body={session_id:conversation,query:$('query').value||'请核查消防隐患及相关法规',facility:$('facility').value,image:await fileData($('photo').files[0]),as_of:$('asof').value,jurisdiction:$('region').value,scene};let route={inspection:'inspect',retrieval:'retrieve',annotation:'annotations'}[$('mode').value];let d=await api('/api/'+route,'POST',body);selected=d.id;notify('已提交，可在任务列表查看进度');await loadJobs();await loadReport(selected)}catch(e){notify(e.message)}};
async function loadJobs(){try{let rows=await api('/api/jobs');$('jobs').innerHTML=rows.map(x=>`<button data-job="${esc(x.id)}"><span class="tag">${names[x.status]||esc(x.status)}</span>${esc(x.input?.query||x.kind)}<br><small>${esc(x.created_at?new Date(x.created_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'')}</small></button>`).join('');$('jobs').querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>loadReport(b.dataset.job))}catch(e){notify(e.message)}}
$('refresh').onclick=loadJobs;
async function loadReport(id){selected=id;try{current=await api('/api/jobs/'+id);let r=current.result?.report;if(!r){$('report').innerHTML=`<div class="card"><h2>${names[current.status]||esc(current.status)}</h2><p>${esc(current.error||'任务执行中，结果会自动更新。')}</p></div>`;return}let evidence=r.evidence||[];$('report').innerHTML=`<div class="card"><div class="row"><h2>核查${r.status==='final'?'定稿':'草稿'}</h2><span class="tag">${names[current.status]||esc(current.status)}</span></div><small>任务 ${esc(id)} · 修订 ${current.revision} · ${esc(r.model_version)} · 执行版本 ${esc(r.execution_version||'2.0')}</small><p class="warn">${r.status==='final'?'已由工作台复核员确认；专业验收状态单独记录。':'本报告待人工复核，缺少依据的结论不可直接定稿。'}</p><img id="site-preview" class="preview hidden" alt="本次核查原始现场照片"><h3>现场观察</h3>${(r.observations||[]).map(o=>`<p><span class="tag">${{visible_anomaly:'可见异常',no_visible_anomaly:'未见明显异常',uncertain:'无法判断'}[o.status]}</span>${esc(o.description)}</p>`).join('')||'<p class="muted">本次未形成可用图像观察。</p>'}<h3>逐条核查</h3><div id="claims">${(r.conclusions||[]).map((c,i)=>`<div class="claim" data-index="${i}"><div class="row"><label>表述类型 <select class="claim-kind"><option value="observation" ${c.kind==='observation'?'selected':''}>现场观察</option><option value="information_request" ${c.kind==='information_request'?'selected':''}>待核查事项</option><option value="legal_assessment" ${c.kind==='legal_assessment'?'selected':''}>法规判断</option></select></label><button class="remove-claim">删除此项</button></div><label>核查表述</label><textarea class="claim-text">${esc(c.text)}</textarea><div class="row"><label>适用性 <select class="claim-app"><option value="unknown" ${c.applicability==='unknown'?'selected':''}>待确认</option><option value="supported" ${c.applicability==='supported'?'selected':''}>适用条件已确认</option><option value="not_applicable" ${c.applicability==='not_applicable'?'selected':''}>不适用</option></select></label><label>证据 <select class="claim-suff"><option value="insufficient" ${c.sufficiency==='insufficient'?'selected':''}>仍需补充</option><option value="sufficient" ${c.sufficiency==='sufficient'?'selected':''}>证据充分</option></select></label></div><label>关联条款（可多选）<select class="claim-ev" multiple>${evidence.map((e,j)=>`<option value="${esc(e.evidence_id)}" ${c.evidence_ids.includes(e.evidence_id)?'selected':''}>[${j+1}] ${esc(e.document_title)}</option>`).join('')}</select></label><label>关联观察（可多选）<select class="claim-obs" multiple>${(r.observations||[]).map(o=>`<option value="${esc(o.observation_id)}" ${c.observation_ids.includes(o.observation_id)?'selected':''}>${esc(o.description)}</option>`).join('')}</select></label><label>待补充信息（逗号分隔）<input class="claim-missing" value="${esc(c.missing_fields?.join('、')||'')}"></label><small>待确认：${esc(c.missing_fields?.join('、')||'无')} · 引用：${c.evidence_ids.map(e=>{let n=evidence.findIndex(x=>x.evidence_id===e);return n>=0?`<a href="#ev${n}">[${n+1}]</a>`:'未知引用'}).join(' ')}</small></div>`).join('')}</div><details open><summary>法规原文与出处（${evidence.length}）</summary>${evidence.map((e,i)=>`<details id="ev${i}"><summary>[${i+1}] ${esc(e.document_title)} · ${esc(e.location?.article||'原文片段')}</summary><p>${esc(e.text)}</p><small>生效：${esc(e.effective_from)} · 适用地区：${esc(e.jurisdiction)}</small><p><a href="${esc(e.source_url)}" target="_blank" rel="noopener">查看官方来源</a></p></details>`).join('')}</details><details><summary>核验问题与执行记录</summary><pre>${esc(JSON.stringify(r.verification,null,2))}</pre><button id="trace">查看执行步骤</button><div id="trace-result"></div></details><h3>补充现场条件</h3><label for="confirmed-use">已确认的建筑用途</label><input id="confirmed-use" placeholder="未知请留空"><label for="confirmed-width">现场实测宽度（米）</label><input id="confirmed-width" type="number" min="0" step="0.01" placeholder="未测量请留空"><label>复核意见</label><textarea id="review-note" placeholder="说明修改理由或需要补充的信息"></textarea><div class="row"><button class="primary" data-review="approve">确认定稿</button><button data-review="return">退回补充</button><button data-review="reject">不采纳</button></div><h3>反馈</h3><div class="row"><button data-signal="like">有帮助</button><button data-signal="dislike">存在问题</button><button data-signal="correction">提交纠错</button></div><details><summary>复核员确认的严重事件</summary><p>确认发生严重事件后立即记录；关联灰度策略将回滚。请在复核意见中填写依据。</p><select id="incident-code"><option value="forged_citation">伪造引用</option><option value="unauthorized">越权事件</option><option value="invalid_finalization">错误定稿</option></select><button id="report-incident">确认上报严重事件</button></details></div>`;
if(previewURL){URL.revokeObjectURL(previewURL);previewURL=null}if(current.input?.image_sha256){let response=await fetch('/api/jobs/'+id+'/image',{headers:{Authorization:'Bearer '+token}});if(response.ok){previewURL=URL.createObjectURL(await response.blob());$('site-preview').src=previewURL;$('site-preview').classList.remove('hidden')}}$('claims').querySelectorAll('.remove-claim').forEach(b=>b.onclick=()=>{let el=b.closest('.claim');el.dataset.deleted='true';el.classList.add('hidden')});
$('report').querySelectorAll('[data-review]').forEach(b=>{b.disabled=!['awaiting_review','awaiting_information'].includes(current.status);b.onclick=()=>sendReview(b.dataset.review)});if(r.status==='final')$('claims').querySelectorAll('input,textarea,select,button').forEach(e=>e.disabled=true);$('report').querySelectorAll('[data-signal]').forEach(b=>b.onclick=async()=>{try{await api('/api/feedback','POST',{run_id:id,signal:b.dataset.signal,text:$('review-note').value});notify('反馈已进入归因队列')}catch(e){notify(e.message)}});$('report-incident').onclick=async()=>{try{await api('/api/reports/'+id+'/incidents','POST',{code:$('incident-code').value,reason:$('review-note').value});notify('严重事件已记录，已执行适用的回滚规则。')}catch(e){notify(e.message)}};$('trace').onclick=async()=>{$('trace-result').innerHTML='<pre>'+esc(JSON.stringify(await api('/api/jobs/'+id+'/trace'),null,2))+'</pre>'};}catch(e){notify(e.message)}}
async function sendReview(action){try{let original=structuredClone(current.result.report.conclusions),claims=[];$('claims').querySelectorAll('.claim').forEach(el=>{if(el.dataset.deleted)return;let c=original[+el.dataset.index];c.kind=el.querySelector('.claim-kind').value;c.missing_fields=el.querySelector('.claim-missing').value.split(/[,，、]+/).map(x=>x.trim()).filter(Boolean);c.evidence_ids=Array.from(el.querySelector('.claim-ev').selectedOptions,o=>o.value);c.observation_ids=Array.from(el.querySelector('.claim-obs').selectedOptions,o=>o.value);c.text=el.querySelector('.claim-text').value;c.applicability=el.querySelector('.claim-app').value;c.sufficiency=el.querySelector('.claim-suff').value;claims.push(c)});await api('/api/reports/'+selected+'/review','POST',{expected_revision:current.revision,action,comment:$('review-note').value,conclusions:claims,confirmed_scene:{...($('confirmed-use').value?{building_use:$('confirmed-use').value}:{}),...($('confirmed-width').value?{measured_width:+$('confirmed-width').value}:{})}});notify('复核已提交');await loadReport(selected)}catch(e){notify(e.message)}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{tab=b.dataset.tab;for(let id of ['inspection','legal','memory','feedback','policies','observability'])$(id).classList.toggle('hidden',id!==tab);if(tab==='inspection')return;try{await renderTab()}catch(e){notify(e.message)}});
async function renderTab(){if(tab==='legal'){let rows=await api('/api/legal');$('legal').innerHTML='<div class="card"><h2>法规版本与来源</h2><p class="muted">按核查日期选取有效版本。此处包含历史版和待生效版。</p><table><tr><th>名称</th><th>生效区间</th><th>范围</th><th>来源</th></tr>'+rows.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.effective_from)} — ${esc(x.effective_until||'未指定终止')}</td><td>${esc(x.jurisdiction)}</td><td><a target="_blank" rel="noopener" href="${esc(x.url)}">官方原文</a></td></tr>`).join('')+'</table><p><button id=legal-snapshots>查看快照与切换</button><button id=legal-rebuild>构建待审核快照</button></p><div id=snapshot-view></div></div>'; $('legal-snapshots').onclick=async()=>{try{let x=await api('/api/legal/snapshots');$('snapshot-view').innerHTML=x.snapshots.map(d=>`<p><span class=tag>${esc(d.state)}</span>${esc(d.id)} · ${d.document_count}份正文 <button data-snapshot="${esc(d.id)}">审核并设为当前快照</button></p>`).join('');$('snapshot-view').querySelectorAll('[data-snapshot]').forEach(b=>b.onclick=async()=>{if(!confirm('确认发布此法规快照？历史任务仍固定原快照。'))return;try{await api('/api/legal/snapshots/'+b.dataset.snapshot+'/publish','POST',{expected_active:x.active});notify('快照已切换');renderTab()}catch(e){notify(e.message)}})}catch(e){notify(e.message)}}; $('legal-rebuild').onclick=async()=>{try{let x=await api('/api/legal/rebuild','POST',{});notify('候选快照构建已提交：'+x.id)}catch(e){notify(e.message)}}}
if(tab==='memory'){let rows=await api('/api/memories');let planes=await api('/api/memories/planes?session_id='+encodeURIComponent(conversation));$('memory').innerHTML='<div class="card"><h2>五类记忆与经验</h2><p>工作记忆：当前会话；情景记忆：历史交互；用户语义记忆：自愿保存的偏好；组织知识记忆：审核经验；程序性记忆：已登记的策略。</p><p>程序性记忆数量：'+planes.procedural.length+'</p><details><summary>工作记忆（当前会话）</summary><pre>'+esc(JSON.stringify(planes.working,null,2))+'</pre></details><details><summary>程序性记忆（策略版本）</summary>'+planes.procedural.map(x=>'<p>'+esc(x.spec.name)+' · '+esc(names[x.state]||x.state)+'</p>').join('')+'</details><p>工作记忆保存30分钟；个人偏好须明确同意后保存。经验不能替代现场事实或法规。</p><label>报告详略偏好</label><select id="detail"><option>简洁</option><option>详细</option></select><p><button id="save-pref">同意保存此偏好</button></p>'+rows.map(x=>`<details><summary>${esc({user:'个人偏好',episode:'任务经历',organization:'审核经验'}[x.kind]||x.kind)}</summary><pre>${esc(JSON.stringify(x.content,null,2))}</pre>${x.kind==='user'?`<button data-delete="${esc(x.id)}">删除偏好</button>`:''}</details>`).join('')+'</div>';$('save-pref').onclick=async()=>{await api('/api/memories/preferences','POST',{key:'report_detail',value:$('detail').value,consent:true});renderTab()};$('memory').querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{await api('/api/memories/'+b.dataset.delete,'DELETE');renderTab()})}
if(tab==='feedback'){let rows=await api('/api/feedback');$('feedback').innerHTML='<div class="card"><h2>反馈归因</h2>'+rows.map(x=>`<details><summary>${esc(x.text||x.signal)} <span class="tag">${esc(x.category||'归因中')}</span></summary><p>${esc(x.attribution?.reason||'等待处理')}</p><small>候选策略：${esc(x.candidate_id||'转数据补充或待处理')}</small><label>人工归因</label><select id="attr-${esc(x.id)}">${Object.entries({intent:'意图识别',vision:'图像识别',retrieval:'检索遗漏',applicability:'法规适用性',generation:'生成表述',knowledge_gap:'知识缺口'}).map(([k,v])=>`<option value="${k}" ${x.category===k?'selected':''}>${v}</option>`).join('')}</select><label>修改理由</label><input id="reason-${esc(x.id)}"><button data-attribution="${esc(x.id)}" data-version="${x.attribution_version||1}">提交归因修正</button></details>`).join('')+'</div>';$('feedback').querySelectorAll('[data-attribution]').forEach(b=>b.onclick=async()=>{try{let id=b.dataset.attribution;await api('/api/feedback/'+id+'/attribution','POST',{category:$('attr-'+id).value,reason:$('reason-'+id).value,expected_version:+b.dataset.version});notify('归因修正已提交');renderTab()}catch(e){notify(e.message)}})}
if(tab==='observability'){let r=await api('/api/observability'); const stageNames={context:'上下文装配',intent:'意图识别',rewrite:'查询改写',retrieve:'法规检索',draft:'起草结论',verify:'证据核验',repair:'准备重写',review_ready:'准备人工复核',detector:'目标定位',observe:'图像观察',specialist:'专项复核',indoor_hydrant:'室内消火栓',outdoor_hydrant:'室外消火栓',fire_extinguisher:'灭火器'}; const stageLabel=name=>name.split(':').map(x=>stageNames[x]||x).join(' · ');$('observability').innerHTML='<div class="card"><h2>运行统计</h2><p>最近'+r.event_count+'条节点记录；'+(r.truncated?'已达到统计窗口上限。':'未达到窗口上限。')+'旧记录未保存的失败状态不计作成功。</p><p class="muted">分位数用于定位耗时，小样本不能作为生产服务承诺。耗时排序不等于并行工作流的关键路径。</p><table><tr><th>节点</th><th>次数</th><th>P50 / P95 / P99（秒）</th><th>失败 / 已知状态</th><th>模型调用</th></tr>'+Object.entries(r.nodes).map(([name,x])=>`<tr><td>${esc(stageLabel(name))}</td><td>${x.count}</td><td>${x.p50.toFixed(2)} / ${x.p95.toFixed(2)} / ${x.p99.toFixed(2)}</td><td>${x.failed_count} / ${x.outcome_known_count}</td><td>${x.model_calls}</td></tr>`).join('')+'</table><p><button id="refresh-stats">刷新统计</button></p></div>';$('refresh-stats').onclick=()=>renderTab()}
if(tab==='policies'){let rows=await api('/api/policies');$('policies').innerHTML='<div class="card"><h2>策略与评测</h2><p>候选策略须完成真实输入回放并经审核，才能进入灰度。样本不足时不会自动扩量。</p>'+rows.map(x=>`<details><summary>${esc(x.spec.name)} <span class="tag">${names[x.state]||esc(x.state)}</span> ${x.id==='baseline-v2'?'默认基线':(x.percentage||0)+'%'}</summary><p>查询扩展：${esc(x.spec.expand_terms.join('、')||'无')}；最多${x.spec.evidence_k}条证据；${x.spec.parent_expand?'补取父条款':'标准上下文'}</p><div class="row"><button data-replay="${esc(x.id)}">选择任务回放</button><button data-results="${esc(x.id)}">查看对照结果</button><button data-publish="${esc(x.id)}" data-version="${x.version}" data-percent="${({0:5,5:20,20:50,50:100})[x.percentage||0]||100}">审核并推进灰度</button><button data-rollback="${esc(x.id)}">回滚</button></div><div id="results-${esc(x.id)}"></div></details>`).join('')+'</div>';
$('policies').querySelectorAll('[data-results]').forEach(b=>b.onclick=async()=>{$('results-'+b.dataset.results).innerHTML='<pre>'+esc(JSON.stringify(await api('/api/policies/'+b.dataset.results+'/results'),null,2))+'</pre>'});
$('policies').querySelectorAll('[data-replay]').forEach(b=>b.onclick=async()=>{let ids=prompt('输入3至60个开发任务编号，以逗号分隔');if(!ids)return;try{let r=await api('/api/policies/'+b.dataset.replay+'/replay','POST',{run_ids:ids.split(/[,，\s]+/).filter(Boolean)});notify('回放任务已提交：'+r.id)}catch(e){notify(e.message)}});
$('policies').querySelectorAll('[data-publish]').forEach(b=>b.onclick=async()=>{if(!confirm('批准将该策略推进到 '+b.dataset.percent+'% 灰度？'))return;try{await api('/api/policies/'+b.dataset.publish+'/publish','POST',{percentage:+b.dataset.percent,expected_revision:+b.dataset.version});renderTab()}catch(e){notify(e.message)}});
$('policies').querySelectorAll('[data-rollback]').forEach(b=>b.onclick=async()=>{let reason=prompt('回滚原因');if(!reason)return;try{await api('/api/policies/'+b.dataset.rollback+'/rollback','POST',{reason});renderTab()}catch(e){notify(e.message)}});
}}
setInterval(()=>{if(token&&tab==='inspection'){loadJobs();if(selected&&['queued','running'].includes(current?.status))loadReport(selected)}},6000);show();
</script></html>
