<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>消防巡检 · Astra 标注复核</title>
<style>body{margin:0;background:#f5f6f8;color:#172130;font:15px/1.65 system-ui,-apple-system,sans-serif}header{background:#142b39;color:white;padding:28px 5vw}header h1{margin:0;font-size:25px}header p{opacity:.8;margin:5px 0}main{margin:22px 5vw}select,input,button,textarea{font:inherit;border:1px solid #c6ced3;border-radius:6px;padding:8px;background:white}button{cursor:pointer;color:#165a64}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}.layout{display:grid;grid-template-columns:270px 1fr;gap:22px}aside{max-height:80vh;overflow:auto}aside button{display:block;width:100%;text-align:left;margin-bottom:5px;font-size:13px}.selected{background:#e0efef;border-color:#19717b}article{background:white;padding:24px;border-radius:10px;border:1px solid #dce1e5}h2{font-size:19px}h3{font-size:16px;border-bottom:1px solid #eee;padding-bottom:6px}.tag{display:inline-block;padding:2px 8px;background:#edf3f5;border-radius:4px;margin-right:7px;font-size:12px}.notice{background:#fff6e3;padding:12px;border-left:3px solid #c38416}.image{max-width:100%;max-height:580px;display:block;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.observation{border-left:3px solid #54a6a2;padding:8px 12px;margin:10px 0;background:#f7f9fa}summary{cursor:pointer;color:#126472}pre{white-space:pre-wrap;word-break:break-word;font:13px/1.6 system-ui}textarea{width:97%;min-height:100px}.small{color:#657783;font-size:13px}@media(max-width:850px){.layout,.grid{grid-template-columns:1fr}aside{max-height:220px}}</style>
<header><h1>消防巡检 · Astra 参考标注</h1><p>原图、场景与法规逐项核对 · 模型辅助标注，人工审定状态单独保留</p><div id="stats"></div></header>
<main><nav><select id="facility"><option value="">全部设施</option><option value="indoor_hydrant">室内消火栓</option><option value="outdoor_hydrant">室外消火栓</option><option value="fire_extinguisher">灭火器</option></select><select id="split"><option value="">全部数据划分</option><option>dev</option><option>validation</option><option>holdout</option></select><select id="issues"><option value="">全部场景</option><option value="issues">存在场景问题</option><option value="images">含原图</option><option value="gaps">法规背景不足</option></select><input id="search" placeholder="搜索场景编号或内容"><button id="download">导出本页复核意见</button><span id="count" class="small"></span></nav><div class="layout"><aside id="list"></aside><article id="detail"></article></div></main>
<script>
const data=__ASTRA_DATA__,reviews={};let current=null;
const labels={indoor_hydrant:'室内消火栓',outdoor_hydrant:'室外消火栓',fire_extinguisher:'灭火器',abnormal:'可见异常',normal:'已观察部位未见异常',uncertain:'无法判断',not_applicable:'无图像判断',visible_anomaly:'可见异常',no_visible_anomaly:'未观察到异常'};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=x=>'<ul>'+x.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>';
$('stats').textContent=`${data.length} 个参考标注 · ${data.filter(x=>x.image_sha256).length} 张原图 · GPT-6 Astra · 专家审定 0 例`;
function save(){if(current&&$('notes'))reviews[current.case_id]={case_id:current.case_id,reviewer:$('reviewer').value,decision:$('decision').value,notes:$('notes').value,reference_protocol:current.protocol,reference_packet_hash:current.packet_hash};}
function render(r){save();current=r;const rev=reviews[r.case_id]||{};document.querySelectorAll('aside button').forEach(b=>b.classList.toggle('selected',b.dataset.id===r.case_id));
$('detail').innerHTML=`<span class="tag">${esc(labels[r.facility])}</span><span class="tag">${esc(r.split)}</span><span class="tag">${esc(labels[r.visual_decision])}</span><h2>${esc(r.case_id)}</h2><p>${esc(r.original_input.query)}</p><p class="small">核查日期 ${esc(r.original_input.as_of)} · ${esc(r.original_input.jurisdiction)} · 快照 ${esc(r.snapshot_id)}</p>${r.scenario_issues.length?'<div class="notice"><b>场景问题（模型发现，待核对）</b>'+list(r.scenario_issues)+'</div>':''}<div class="grid"><section><h3>现场原图</h3>${r.review_image?'<a href="'+esc(r.review_image)+'" target="_blank" rel="noopener"><img class="image" src="'+esc(r.review_image)+'" alt="本例现场原图，点击查看完整尺寸"></a>':'<p class="small">本例没有图像；文字场景事实不作为视觉证据。</p>'}<h3>已提供场景事实</h3>${list(r.scene_facts)}</section><section><h3>Astra 视觉标签</h3>${r.gold_observations.map(o=>'<div class="observation"><b>'+esc(o.object)+' · '+esc(labels[o.status])+'</b><p>'+esc(o.description)+'</p><span class="small">'+esc(o.hazard_labels.join('、'))+'</span></div>').join('')||'<p>不适用</p>'}</section></div><h3>参考答案</h3><p>${esc(r.reference_answer)}</p><h3>关键评判点</h3>${list(r.critical_points)}<h3>需要补充的信息</h3>${list(r.missing_information)}<h3>不可作出的结论</h3>${list(r.forbidden_claims)}<h3>法规证据</h3>${Object.entries(r.reference_aliases).map(([k,e])=>'<details><summary>'+esc(k+' · '+e.title+' · '+e.article)+'</summary><p>生效：'+esc(e.effective_from)+'，失效（不含）：'+esc(e.effective_until||'未指定')+'</p><pre>'+esc(e.text)+'</pre><a target="_blank" rel="noopener" href="'+esc(e.source_url)+'">查看来源</a><p class="small">'+esc(e.evidence_id)+'</p></details>').join('')}<details><summary>背景不足与标注溯源</summary>${list(r.knowledge_gaps)}<p class="small">模型置信度：${esc(r.confidence)}（模型自述，未经校准）。自动校验通过只表示格式、引用及版本检查通过。</p><pre>${esc(JSON.stringify({model:r.returned_model,protocol:r.protocol,packet_hash:r.packet_hash,source:r.annotation_source,context:r.context_selection},null,2))}</pre></details><h3>人工复核意见</h3><p class="small">本页意见仅在当前页面保存。导出后交由项目审核流程处理；不会自动将模型标签变为专家金标。</p><input id="reviewer" placeholder="复核人姓名" value="${esc(rev.reviewer||'')}"><select id="decision"><option value="pending">待复核</option><option value="agree">认可参考标签</option><option value="revise">需要修改</option><option value="reject">不采纳</option></select><p><textarea id="notes" placeholder="修改内容、理由及补充依据">${esc(rev.notes||'')}</textarea></p>`;$('decision').value=rev.decision||'pending';}
function filter(){save();let q=$('search').value.trim();let rows=data.filter(r=>(!$('facility').value||r.facility===$('facility').value)&&(!$('split').value||r.split===$('split').value)&&(!$('issues').value||($('issues').value==='images'?r.image_sha256:$('issues').value==='issues'?r.scenario_issues.length:r.knowledge_gaps.length))&&(!q||(r.case_id+r.original_input.query+r.reference_answer).includes(q)));$('count').textContent=`显示 ${rows.length} / ${data.length}`;$('list').innerHTML=rows.map(r=>'<button data-id="'+esc(r.case_id)+'">'+esc(r.case_id)+'<br><span class="small">'+esc(labels[r.visual_decision])+(r.scenario_issues.length?' · 场景待核对':'')+'</span></button>').join('');$('list').querySelectorAll('button').forEach(b=>b.onclick=()=>render(rows.find(r=>r.case_id===b.dataset.id)));if(rows.length)render(rows.find(r=>current&&r.case_id===current.case_id)||rows[0]);else{$('detail').innerHTML='<p>没有匹配场景。</p>';current=null;}}
['facility','split','issues','search'].forEach(id=>$(id).addEventListener('input',filter));$('download').onclick=()=>{save();let blob=new Blob([JSON.stringify({type:'human_review_notes_not_automatic_gold',created_at:new Date().toISOString(),reviews:Object.values(reviews).filter(r=>r.reviewer||r.notes||r.decision!=='pending')},null,2)],{type:'application/json'});let link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='Astra标注复核意见.json';link.click();URL.revokeObjectURL(link.href);};window.addEventListener('beforeunload',e=>{save();if(Object.values(reviews).some(r=>r.notes||r.reviewer)){e.preventDefault();e.returnValue='';}});filter();
</script></html>
