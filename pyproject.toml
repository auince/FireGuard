[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xfagent"
version = "0.1.0"
description = "Evidence-grounded multimodal fire inspection"
requires-python = ">=3.10"
dependencies = ["langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4", "flask>=3,<4", "requests>=2.32", "beautifulsoup4>=4.12", "numpy>=1.24", "pillow>=10", "pypdf>=5", "cryptography>=3.1", "python-docx>=1.1", "openai>=1.50", "anthropic>=0.40", "python-dotenv>=1", "gunicorn>=23"]

[project.optional-dependencies]
test = ["pytest>=8"]
models = ["torch>=2.6", "transformers==5.3.0", "sentence-transformers>=3", "peft==0.18.1", "trl==1.14.1", "datasets>=3", "accelerate>=1", "ultralytics>=8.3", "diffusers>=0.32"]

[project.scripts]
xfagent = "xfagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
