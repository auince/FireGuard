name: console-and-contracts
on: [push, pull_request]
jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - run: npm ci && npm run format:check && npm run build
        working-directory: apps/console
  durable-contracts:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-v2.lock
      - run: |
          docker run -d --name mongo --network host mongo:7 --replSet xfagent --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1})' && break; sleep 1; done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"xfagent",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)' && break; sleep 1; done
      - run: PYTHONPATH=src pytest tests/server tests/practice tests/v2 -q
        env:
          XF_V2_MONGO: mongodb://127.0.0.1:27017/?replicaSet=xfagent&directConnection=true
          XF_V2_REDIS: redis://127.0.0.1:6379/0
